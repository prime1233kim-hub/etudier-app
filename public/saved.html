<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Research — ÉTUDIER</title>
<meta name="description" content="Your saved looks, research collections and fashion glossary.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/etudier.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">

<section class="page-head">
  <div class="wrap">
    <span class="label">My Research</span>
    <h1 class="display">Your <em>study notes.</em></h1>
    <p class="lede">Saved looks, research collections and the terms you are learning. Everything here is stored in this browser only: it isn’t uploaded, and it won’t appear on other devices.</p>
    <div id="storage-warning"></div>
    <div class="tabs" role="tablist" aria-label="My Research">
      <button type="button" role="tab" id="tab-looks" aria-controls="panel-looks" aria-selected="true">Saved looks</button>
      <button type="button" role="tab" id="tab-collections" aria-controls="panel-collections" aria-selected="false" tabindex="-1">Collections</button>
      <button type="button" role="tab" id="tab-glossary" aria-controls="panel-glossary" aria-selected="false" tabindex="-1">Glossary</button>
    </div>
  </div>
</section>
<section class="wrap">
  <div class="panel" role="tabpanel" id="panel-looks" aria-labelledby="tab-looks"></div>
  <div class="panel" role="tabpanel" id="panel-collections" aria-labelledby="tab-collections" hidden></div>
  <div class="panel" role="tabpanel" id="panel-glossary" aria-labelledby="tab-glossary" hidden></div>
</section>
<section class="wrap results" id="saved-view" hidden aria-label="Saved look"></section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script type="module" src="/js/site.js"></script>
<script type="module" src="/js/saved.js"></script>
</body>
</html>
