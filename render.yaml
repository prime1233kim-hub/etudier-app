# Render Blueprint: lets Render set the service up from this file.
# No keys are stored here — Render asks for GEMINI_API_KEY when you create
# the service. (To use paid Claude instead, add ANTHROPIC_API_KEY later in
# the service's Environment settings.)
services:
  - type: web
    name: etudier-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
